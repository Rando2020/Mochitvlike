name: Cloud Smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start disposable database and apply migrations
        run: supabase start
      - name: Validate fresh migration replay and RLS
        run: |
          supabase db reset --local
          supabase test db
      - name: Configure disposable smoke environment
        run: |
          supabase status -o env > /tmp/smoke-env
          node scripts/smoke-environment.mjs /tmp/smoke-env
        env:
          CLOUD_SMOKE: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-smoke-failures
          path: test-results/
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
