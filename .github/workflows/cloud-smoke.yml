name: Cloud Smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start disposable database and apply migrations
        run: supabase start
      - name: Validate fresh migration replay and RLS
        run: |
          supabase db reset --local
          # pg_prove mounts the test directory only. Inline the actual migration
          # into the transaction test before sending it to that container.
          python - <<'PYTEST'
          from pathlib import Path
          test = Path('supabase/tests/pipeline_rpc_access.sql')
          migration = Path('supabase/migrations/20261004003600_revoke_anonymous_pipeline_execution.sql')
          include = '\\ir ../migrations/' + migration.name
          source = test.read_text()
          assert source.count(include) == 1
          test.write_text(source.replace(include, migration.read_text()))
          PYTEST
          supabase test db
      - name: Configure disposable smoke environment
        run: |
          supabase status -o env > /tmp/smoke-env
          node scripts/smoke-environment.mjs /tmp/smoke-env
        env:
          CLOUD_SMOKE: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-smoke-failures
          path: test-results/
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
