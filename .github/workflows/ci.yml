name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund
      - run: python -m pip install -r ml/visual-evaluation/requirements.lock
      - run: python -m pip install -e ml/visual-evaluation --no-deps
      - run: npm run typecheck
      - run: npm test
      - run: pytest ml/visual-evaluation/tests
      - run: npm run build
