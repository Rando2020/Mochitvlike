<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
<title id="title">Episode planning board and Your series drawer</title><desc id="desc">Design fixture with abridged example copy. Left: ordered scene plan cards with draft, ready, and missing states. Right: a read-only drawer containing cast, locations, and visual direction. This is not a browser screenshot or rendered episode.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#eeeaf9}.muted{fill:#b4b1c4;font-size:15px}.label{fill:#c4b8ff;font-size:12px;font-weight:700;letter-spacing:1px}.heading{font-size:25px;font-weight:700}.body{font-size:16px}.small{font-size:13px}</style></defs>
